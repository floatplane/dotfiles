# ~/.tmux.conf  (tmux 3.4) — default C-b prefix

# --- General ---
set -g mouse on           # scroll, click panes, drag to resize
set -g history-limit 50000
set -g base-index 1       # windows start at 1 (matches the 1..9 key row)
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10    # snappier ESC handling
set -g focus-events on

# True color + terminal niceties
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 24-bit color in supporting terminals
set -g set-titles on                        # window title follows the active session
set -g set-titles-string "#S · #W"

# Copy in tmux lands on the system clipboard, even over SSH (OSC 52 —
# requires a terminal that supports it; most modern ones do).
set -s set-clipboard on

# Killing a session switches to another instead of dumping you out of tmux.
set -g detach-on-destroy off

# Window size follows the smallest client actually viewing it, not the
# smallest one merely attached.
setw -g aggressive-resize on

# --- Reload config without restarting: C-b r ---
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# --- Friendlier splits: keep current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Move between panes with C-b + arrows (repeatable) ---
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D

# --- Resize panes with C-b + Shift+arrows (repeatable) ---
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# --- Quick scratch shell in a popup: C-b g (q or exit to close) ---
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# --- Status bar ---
set -g status-interval 5
set -g status-left-length 30
set -g status-left  " #S  "
set -g status-right " %Y-%m-%d %H:%M "
